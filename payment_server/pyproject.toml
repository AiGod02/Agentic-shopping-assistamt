[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "payment-server"
version = "0.1.0"
description = "Payment Server — Universal Agentic Commerce"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.108.0",
    "uvicorn[standard]>=0.25.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy[asyncio]>=2.0.23",
    "aiosqlite>=0.19.0",
    "httpx>=0.25.2",
    "commerce-shared",
]

[project.optional-dependencies]
full = [
    "asyncpg>=0.29.0",
    "redis[hiredis]>=5.0.1",
    "aiokafka>=0.10.0",
    "stripe>=7.10.0",
    "razorpay>=1.4.1",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.8",
]

[tool.hatch.build.targets.wheel]
packages = ["payment_server"]
