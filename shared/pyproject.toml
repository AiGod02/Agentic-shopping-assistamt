[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commerce-shared"
version = "0.1.0"
description = "Shared libraries for Universal Agentic Commerce Infrastructure"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy[asyncio]>=2.0.23",
    "PyJWT>=2.8.0",
    "cryptography>=41.0.7",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.25.2",
    "prometheus-client>=0.19.0",
    "structlog>=23.2.0",
]

[project.optional-dependencies]
# Install these only if you have the infrastructure
postgres = ["asyncpg>=0.29.0"]
redis = ["redis[hiredis]>=5.0.1"]
kafka = ["aiokafka>=0.10.0"]
otel = [
    "opentelemetry-api>=1.21.0",
    "opentelemetry-sdk>=1.21.0",
    "opentelemetry-exporter-otlp>=1.21.0",
    "opentelemetry-instrumentation-fastapi>=0.42b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.42b0",
    "opentelemetry-instrumentation-redis>=0.42b0",
    "opentelemetry-instrumentation-httpx>=0.42b0",
]
# Install everything
all = ["commerce-shared[postgres,redis,kafka,otel]"]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.8",
    "mypy>=1.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["shared"]
